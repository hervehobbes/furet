[changelog]
header = """
# Changelog

All notable changes to furet. Versions follow [Semantic Versioning](https://semver.org/);
lot numbers refer to [ROADMAP.md](ROADMAP.md).
"""
body = """
{% if version %}## {{ version | trim_start_matches(pat="v") }} — {{ timestamp | date(format="%Y-%m-%d") }}{% else %}## Unreleased{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}- {% if commit.breaking %}**BREAKING** {% endif %}{{ commit.message | split(pat="\n") | first | upper_first }}
{% endfor %}{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
filter_commits = true
commit_preprocessors = [
  { pattern = '\s*(\([^)]*\b(lot|prompts?)\b[^)]*\)|[—-]\s*(relecture )?prompt \S+)', replace = "" },
]
commit_parsers = [
  { message = "(?i)\\b(lot|relecture)\\b", skip = true },
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = ".*", skip = true },
]
tag_pattern = "v[0-9].*"
